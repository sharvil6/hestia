name: Mobile Preview (EAS Update)

# Runs on push to main only — EAS Update publishes a live bundle to the
# "preview" channel. Open the project in Expo Go to get the latest build.
#
# Prerequisites (one-time local setup):
#   1. Run `eas update:configure` inside mobile/ to add expo-updates to app.json
#   2. Add EXPO_TOKEN to GitHub repo secrets (expo.dev → Account → Access Tokens)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'shared/**'
      - '.github/workflows/mobile-preview.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    environment: CICD
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit
        working-directory: mobile

      - name: Publish EAS Update
        run: eas update --branch preview --message "CI ${{ github.sha }}" --platform ios
        working-directory: mobile

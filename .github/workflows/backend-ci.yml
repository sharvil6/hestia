name: Backend CI

# PR-only entry point. Main-branch CI runs inside deploy.yml so that the
# deploy job can `needs:` it directly — no `workflow_run` race.
# Logic lives in _backend-ci.yml.

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/_backend-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_backend-ci.yml

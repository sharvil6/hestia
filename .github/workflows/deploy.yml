name: Deploy

# Runs full CI in parallel on every push to main, then deploys only if all
# CI jobs pass. The deploy job runs on the self-hosted runner on the prod VM;
# the mobile-publish job uses EAS Update to ship an OTA bundle to the preview
# channel. CI jobs run on GitHub-hosted ubuntu-latest.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Avoid stacking deploys if pushes land close together.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v

  frontend-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Build
        run: npm run build -w frontend
        env:
          NEXT_PUBLIC_API_URL: https://ci-placeholder.invalid

  mobile-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit
      - name: Type check
        run: npx tsc --noEmit

  deploy:
    needs: [backend-ci, frontend-ci, mobile-ci]
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Build (as hestia user)
        run: sudo -n -u hestia /bin/bash /srv/hestia/repo/deploy/deploy.sh

      - name: Restart services
        run: |
          sudo -n /usr/bin/systemctl restart hestia-backend.service
          sudo -n /usr/bin/systemctl restart hestia-frontend.service
          sudo -n /usr/bin/systemctl restart hestia-demo-backend.service
          sudo -n /usr/bin/systemctl restart hestia-demo-frontend.service

      - name: Backend health check
        run: |
          # Silence transient connection errors during the retry window — the
          # service takes ~1s to bind the port after `systemctl restart`, and
          # the first few attempts may fail noisily without indicating a problem.
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "backend OK after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "Backend failed to become healthy within 60s" >&2
          sudo -n /usr/bin/journalctl -u hestia-backend.service -n 50 --no-pager >&2
          exit 1

      - name: Frontend health check
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
              echo "frontend OK after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to become healthy within 60s" >&2
          sudo -n /usr/bin/journalctl -u hestia-frontend.service -n 50 --no-pager >&2
          exit 1

      - name: Demo backend health check
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8001/health >/dev/null 2>&1; then
              echo "demo backend OK after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "Demo backend failed to become healthy within 60s" >&2
          sudo -n /usr/bin/journalctl -u hestia-demo-backend.service -n 50 --no-pager >&2
          exit 1

      - name: Demo frontend health check
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/ >/dev/null 2>&1; then
              echo "demo frontend OK after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "Demo frontend failed to become healthy within 60s" >&2
          sudo -n /usr/bin/journalctl -u hestia-demo-frontend.service -n 50 --no-pager >&2
          exit 1

  mobile-publish:
    # EAS Update — publishes an OTA JS bundle to the "preview" channel. Open
    # the project in Expo Go to pull the latest build.
    #
    # Prerequisites (one-time):
    #   1. Run `eas update:configure` inside mobile/ to add expo-updates to app.json
    #   2. Add EXPO_TOKEN to GitHub repo secrets (expo.dev → Account → Access Tokens)
    needs: [backend-ci, frontend-ci, mobile-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: CICD
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit
        working-directory: mobile
      - name: Publish EAS Update
        run: eas update --branch preview --message "CI ${{ github.sha }}"
        working-directory: mobile
